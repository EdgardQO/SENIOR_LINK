spring.application.name=api

# Entorno local: DB_URL y DB_USERNAME tienen valores predeterminados.
# Define DB_PASSWORD y JWT_SECRET_BASE64 fuera de Git.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SENIOR_LINK}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
seniorlink.jwt.secret-base64=${JWT_SECRET_BASE64}
seniorlink.jwt.expiration-minutes=60
seniorlink.frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:4321,http://127.0.0.1:4321,http://localhost:5173,http://127.0.0.1:5173}

# Permite a Hibernate crear los esquemas declarados por las entidades JPA.
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
