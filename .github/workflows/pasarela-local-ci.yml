name: Validacion pasarela local
on:
  push:
    branches: [main, dev/pasarela-local, feat/fotos-perfil-reservas]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pasarela-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: seniorlink_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d seniorlink_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/seniorlink_ci
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET_BASE64: Y2ktb25seS1zZW5pb3JsaW5rLXRlc3Qtc2VjcmV0LWZha2Utc2VjcmV0LTEyMzQ1Njc4OTA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Maven tests and JPA startup
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Astro
        working-directory: frontend
        run: |
          npm ci
          npm run build
